<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<script src="layout.js"></script>
<title>See each run&#x27;s progress</title>
</head>
<body>
<div class="shot">
    <div class="caption">
        <h1>See each run&#x27;s progress</h1>
        <p>Searches open one tab at a time and close once they&#x27;ve loaded.</p>
    </div>
    <div class="browser" data-tab="New Tab" data-url=""></div>
    <img class="popup" data-ui="popup-progress.png" alt="">
    <svg class="leaders" aria-hidden="true"></svg>
    <div class="callout" data-target="progress">Progress of the current run</div>
    <div class="callout" data-target="stop">Stop it any time</div>
</div>
</body>
</html>
