<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="store.css">
<script src="layout.js"></script>
<title>Set it up your way</title>
</head>
<body>
<div class="shot">
    <div class="caption">
        <h1>Set it up your way</h1>
        <p>Choose how many searches to run, the gap between them and how long each tab stays open.</p>
    </div>
    <div class="browser" data-tab="New Tab" data-url=""></div>
    <img class="popup" data-ui="popup-settings.png" alt="">
    <svg class="leaders" aria-hidden="true"></svg>
    <div class="callout" data-target="searches">Number of searches</div>
    <div class="callout" data-target="timeout">Pause between searches</div>
</div>
</body>
</html>
