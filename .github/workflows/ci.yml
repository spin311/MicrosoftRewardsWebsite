name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  extension:
    name: Extension — typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wxt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run compile
      - run: npm run test
      # Both targets are built: the Chrome (MV3) and Firefox outputs differ
      # enough that one passing does not imply the other does.
      - run: npm run build
      - run: npm run build:firefox

  mobile:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microsoft_rewards_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
